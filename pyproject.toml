[project]
name = "lazy-create-project"
version = "0.1.0"
description = "自动化创建完整项目的 CLI 工具"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project.scripts]
lazy-create-project = "lazy_create_project.cli:main"
lz-sv = "lazy_create_project.sv_cli:main"

[tool.setuptools.packages.find]
include = ["lazy_create_project*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
