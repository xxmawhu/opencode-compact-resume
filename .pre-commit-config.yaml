repos:
  # --- TypeScript / JavaScript ---
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: node_modules/.bin/prettier --write --ignore-unknown
        language: system
        types_or: [ts, javascript, json, markdown, yaml]
        stages: [pre-commit]

      - id: eslint
        name: eslint
        entry: node_modules/.bin/eslint --fix
        language: system
        types_or: [ts, javascript]
        stages: [pre-commit]

      - id: tsc
        name: tsc (typecheck)
        entry: node_modules/.bin/tsc -p tsconfig.json --noEmit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
