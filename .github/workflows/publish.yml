name: publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Publish via trusted publishing
        run: |
          set -o pipefail
          log="${RUNNER_TEMP}/npm-publish.log"
          if npm publish 2>&1 | tee "$log"; then
            exit 0
          fi
          msg=$(tail -20 "$log" | tr '\r\n' '  ' | cut -c1-900 | sed 's/%/%25/g')
          echo "::error title=npm publish failed::${msg}"
          exit 1
